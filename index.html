<body class="no-js">
  <div id="ra2web-root">
    <div id="startup-load-check-host" data-state="loading" role="status" aria-live="polite">
      <div id="startup-load-check-title">加载中</div>
      <div id="startup-load-check-progress" role="progressbar" aria-label="加载进度" aria-valuemin="0"
        aria-valuemax="100" aria-valuenow="0">
        <div id="startup-load-check-progress-bar"></div>
      </div>
    </div>
  </div>
  <script id="startup-load-check-runtime">
    (() => {
      const root = document.getElementById('ra2web-root');
      const host = document.getElementById('startup-load-check-host');
      const title = document.getElementById('startup-load-check-title');
      const progress = document.getElementById('startup-load-check-progress');
      const progressBar = document.getElementById('startup-load-check-progress-bar');
      if (!root || !host || !title || !progress || !progressBar) return;

      let active = true;
      let mainUiObserver;
      const setProgress = (value) => {
        if (!active || !Number.isFinite(value)) return;
        const normalized = Math.max(0, Math.min(100, Math.round(value)));
        progress.setAttribute('aria-valuenow', String(normalized));
        progressBar.style.width = `${normalized}%`;
      };
      // app.js 会传入阶段文案，这里刻意只取进度值，界面上不显示这些提示。
      const setPhase = (message, description, progressValue) => {
        if (typeof progressValue === 'number') setProgress(progressValue);
      };
      const fail = (message, reason) => {
        if (!active) return;
        host.dataset.state = 'error';
        title.textContent = '加载失败';
        if (reason) console.error('Startup failed:', reason);
      };
      const dismiss = () => {
        if (!active) return;
        active = false;
        mainUiObserver?.disconnect();
        host.remove();
        delete window.__ra2webStartupLoadCheck;
      };

      window.__ra2webStartupLoadCheck = { dismiss, fail, setPhase, setProgress };
      document.body.classList.remove('no-js');

      if (typeof MutationObserver === 'function') {
        mainUiObserver = new MutationObserver(() => {
          if ([...root.children].some((child) => child !== host)) dismiss();
        });
        mainUiObserver.observe(root, { childList: true });
      }

      if (!browserSupported) {
        fail('当前浏览器不受支持');
      }
    })();
  </script>
